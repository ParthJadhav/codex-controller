name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish universal macOS release
    runs-on: macos-14
    timeout-minutes: 90
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release tag and credentials
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY_CONTENT"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit the complete release toolchain
        run: npm audit --audit-level=high

      - name: Run application tests
        run: |
          npm test
          swift test --package-path native

      - name: Build signed universal DMG and ZIP
        run: npm run dist

      - name: Notarize the exact release artifacts
        run: npm run release:notarize

      - name: Verify signing, notarization, and both architectures
        run: npm run release:verify

      - name: Write checksums and SBOM
        run: |
          (cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)
          npm sbom --sbom-format cyclonedx > "dist/codex-controller-$(node -p "require('./package.json').version")-sbom.cdx.json"

      - name: Retain the verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-controller-${{ github.ref_name }}-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/*-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            dist/*-sbom.cdx.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Codex Controller $GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove the temporary App Store Connect key
        if: always()
        run: rm -f "$APPLE_API_KEY"
