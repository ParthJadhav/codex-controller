name: Bug report
description: Report a reproducible problem in Codex Controller.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Codex Controller. Do not include credentials, private Codex content, or raw controller identifiers.
  - type: input
    id: version
    attributes:
      label: Codex Controller version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 15.6, Apple silicon
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Controller connection
      options: [USB, Bluetooth, No controller, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Attach diagnostic logs

        In Finder, choose **Go > Go to Folder…**, enter `~/Library/Logs/Codex Controller/`, then drag `main.log` and any `main.1.log`–`main.3.log` files into the field below. Logs are stored only on your Mac and capped at approximately 20 MB total. Please review them before sharing.
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic log files
      description: Drag the files here to attach them. If logs are unavailable, briefly explain why.
      placeholder: Drag main.log and any numbered archives here, or explain why they are unavailable.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I reviewed my description and attached logs and removed credentials, private task content, and unique device identifiers.
          required: true
